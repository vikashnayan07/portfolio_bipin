<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Favicon: SVG for modern browsers, PNG fallback for Apple -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="%PUBLIC_URL%/files/favicon-bk-v2.svg?v=2"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0A192F" />
    <meta
      name="description"
      content="Bipin Kumar — BPSC Aspirant & Future Educator | Personal Portfolio | Bihar"
    />

    <!-- Preconnect to critical origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://xinyyvsjwuwyocsrmfzk.supabase.co" crossorigin />

    <!-- Google Fonts — non-blocking with display=swap -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <!-- Preload critical hero background -->
    <link rel="preload" as="image" type="image/webp" href="%PUBLIC_URL%/pudha_bg.webp" />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Bipin Kumar | BPSC Aspirant & Educator</title>
  </head>
